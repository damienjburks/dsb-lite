name: Deploy DSB Lite

# End-to-end deploy, ordered so infrastructure is provisioned BEFORE the image
# is built and rolled out:
#
#   1. terraform  — provision/refresh infra (ECR, ECS, ALB, IAM, logs)
#   2. deploy     — build the image, push to ECR, update the ECS service
#
# The `deploy` job `needs: terraform`, so it only starts after Terraform
# succeeds. On pull requests, only `terraform` runs (as a speculative plan);
# no image is built or pushed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# --- Configure these to match your environment -----------------------------
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN     : AppDeployRoleArn from the bootstrap stack (ECR + ECS)
#   TF_AWS_ROLE_ARN  : TerraformDeployRoleArn from the bootstrap stack (infra)
# Terraform backend (bucket/key/region) is hardcoded in terraform/backend.tf.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dsb-lite
  ECS_CLUSTER: dsb-lite-cluster
  ECS_SERVICE: dsb-lite-service
  CONTAINER_NAME: dsb-lite
  TASK_FAMILY: dsb-lite
  TF_WORKING_DIR: terraform

# OIDC requires id-token: write. contents: read to checkout; pull-requests:
# write so the Terraform plan can be posted to PRs.
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 1. Terraform — provision/refresh infrastructure first.
  #    PR  -> fmt/validate/plan (plan posted to job summary)
  #    push/dispatch -> apply
  # ===========================================================================
  terraform:
    name: Terraform ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        # Backend bucket/key/region are hardcoded in backend.tf, so no
        # -backend-config flags are needed here.
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Publish plan to summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '### Terraform Plan 📖';
            echo '';
            echo '```terraform';
            tail -c 60000 plan.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false -auto-approve

  # ===========================================================================
  # 2. Deploy — build/push the image and update ECS. Runs only AFTER Terraform
  #    succeeds, and never on pull requests.
  # ===========================================================================
  deploy:
    name: Build and deploy image
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_VERSION="$(node -p "require('./package.json').version")"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg BUILD_TIME="${BUILD_TIME}" \
            --build-arg GIT_COMMIT="${IMAGE_TAG}" \
            -t "${IMAGE_URI}" .

          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          set -euo pipefail
          # Fetch the active task definition and strip the read-only fields that
          # RegisterTaskDefinition rejects, leaving a clean template to re-register.
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition' \
            --output json \
          | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            > task-definition.json

      - name: Render new task definition with updated image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
